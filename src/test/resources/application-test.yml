spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    type: simple

app:
  jwt:
    secret: aW52ZW50b3J5LWFsZXJ0LWRlbW8tc2VjcmV0LWtleS0zMmJ5dGVzLQ==
    expiration-ms: 3600000
  scheduler:
    enabled: false
    alert-cron: "0 0 9 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.inventory.alert: INFO
