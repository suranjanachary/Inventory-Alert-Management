spring:
  application:
    name: inventory-alert-management
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/inventory_alert
    username: inventory
    password: inventory
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Schema owned by Flyway; Hibernate must not mutate DDL.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple

app:
  jwt:
    # Base64-encoded 256-bit+ secret. Override with JWT_SECRET in real environments.
    secret: ${JWT_SECRET:aW52ZW50b3J5LWFsZXJ0LWRlbW8tc2VjcmV0LWtleS0zMmJ5dGVzLQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

logging:
  level:
    root: INFO
    com.inventory.alert: INFO
