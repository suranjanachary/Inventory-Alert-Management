spring:
  application:
    name: inventory-alert-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
  datasource:
    hikari:
      pool-name: inventory-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  scheduler:
    alert-cron: ${ALERT_SCHEDULER_CRON:0 0 9 * * *}
    enabled: ${ALERT_SCHEDULER_ENABLED:true}
  cache:
    products-by-id: productsById
    products-by-sku: productsBySku
    product-search: productSearch
    low-stock: lowStockProducts
  correlation:
    header: X-Correlation-Id

management:
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

info:
  app:
    name: Inventory Alert Management
    description: Inventory monitoring and low-stock alerts
    version: 0.0.1-SNAPSHOT

logging:
  level:
    root: INFO
    com.inventory.alert: INFO
