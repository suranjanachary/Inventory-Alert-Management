services:
  mysql:
    image: mysql:8.0
    container_name: inventory-alert-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: inventory_alert
      MYSQL_USER: inventory
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-inventory}
    volumes:
      - inventory_alert_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - inventory-net

  app:
    build: .
    container_name: inventory-alert-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_alert
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-inventory}
      JWT_SECRET: ${JWT_SECRET:-aW52ZW50b3J5LWFsZXJ0LWRlbW8tc2VjcmV0LWtleS0zMmJ5dGVzLQ==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      ALERT_SCHEDULER_CRON: ${ALERT_SCHEDULER_CRON:-0 0 9 * * *}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - inventory-net

volumes:
  inventory_alert_mysql_data:

networks:
  inventory-net:
    driver: bridge
